<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/Constellation-Sahara-Ares/logos/Web.svg"
		/>

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Constellation</title>

		<!-- https://realfavicongenerator.net/ useful site-->
		<link
			rel="icon"
			type="image/png"
			href="/favicons/favicon-96x96.png"
			sizes="96x96"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/Constellation-Sahara-Ares/favicons/favicon.svg"
		/>
		<link
			rel="shortcut icon"
			href="/Constellation-Sahara-Ares/favicons/favicon.ico"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/Constellation-Sahara-Ares/favicons/apple-touch-icon.png"
		/>
		<meta name="apple-mobile-web-app-title" content="Constellation" />
		<link
			rel="manifest"
			href="/Constellation-Sahara-Ares/manifest.webmanifest"
		/>

		<!-- boot.css -->
		<link
			rel="stylesheet"
			href="/Constellation-Sahara-Ares/styles/boot.css"
		/>
	</head>

	<body>
		<div class="hidden" style="display: none">
			<canvas id="hiddenCanvas"></canvas>
		</div>

		<div class="bootCover">
			<img class="bootImage" src="./logos/Constellation.svg" />
			<span class="loader"></span>
			<p class="bootText">Initialising...</p>
		</div>

		<!-- Vercel general -->
		<script>
			window.si =
				window.si ||
				function () {
					(window.siq = window.siq || []).push(arguments);
				};
			window.va =
				window.va ||
				function () {
					(window.vaq = window.vaq || []).push(arguments);
				};
		</script>

		<script defer type="module" src="src/buildCheck.js"></script>
	</body>
</html>
